{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pomo{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'web/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'dashboard' %}">pomo</a>
    <nav class="nav">
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'session_list' %}">Sessions</a>
      <a href="{% url 'session_create' %}">New session</a>
      <a href="/admin/">Admin</a>
    </nav>
  </header>

  <main class="shell">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="message {{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>pomo</span>
    <span>Public dashboard · admin requires login</span>
  </footer>
</body>
</html>
