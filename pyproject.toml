[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pomoism"
version = "0.1.0"
authors = [
  { name="Gopar", email="danielgopar@gmail.com" },
]
description = "A multi-machine pomodoro timer that syncs via a home-base server."
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/gopar/pomoism"
Issues = "https://github.com/gopar/pomoism/issues"

[project.scripts]
pomo = "pomo.cli:main"
pomo-agent = "pomo.agent:main"
pomo-server = "pomo.server:main"

[tool.hatch.build.targets.wheel]
packages = ["pomo"]

[tool.hatch.build.targets.sdist]
include = [
    "pomo/",
    "hooks/examples/",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["N818"]  # exception class names (ServerUnavailable is fine)

[tool.ruff.lint.isort]
known-first-party = ["pomo"]

[tool.ruff.lint.per-file-ignores]
"pomo/*.py" = ["UP036"]  # version guard for 3.11+ is intentional
"pomo/server.py" = ["N802"]  # do_GET/do_POST are stdlib overrides
"tests/*.py" = ["SIM117"]  # nested with

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
    "ty>=0.0.66",
]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
