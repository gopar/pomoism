# Home-base pomo server. Alternative to systemd/pomo-server.service — run ONE
# of them, not both, on the home-base machine.
#
#   docker compose up -d
#   docker compose logs -f
services:
  server:
    build: .
    image: pomo-server
    container_name: pomo-server
    ports:
      - "8787:8787"
    volumes:
      - pomo-data:/data
    environment:
      # Set to your local timezone so "today" queries match your clock.
      # Find your zone: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      TZ: "America/Los_Angeles"
      POMO_HOST: "0.0.0.0"
      POMO_PORT: "8787"
      # Uncomment to require a bearer token (also set it on every agent):
      # POMO_TOKEN: "change-me"
    restart: unless-stopped

volumes:
  pomo-data:
